name: CI
on: [push, pull_request]

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Frozen
        run: pnpm install --frozen-lockfile

      - name: run lint
        run: pnpm lint

      - name: run prettier
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: run tsc
        run: pnpm exec tsc --noEmit

      - name: run test
        run: pnpm test
